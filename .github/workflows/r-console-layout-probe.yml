name: R console layout probe
on:
  push:
    branches: [codex/r-console-toolbar-native-probe]
    paths:
      - Tests/r-console-integration-driver.swift
      - .github/workflows/r-console-layout-probe.yml
permissions:
  contents: read
concurrency:
  group: r-console-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      STATSDIRECT_CONTENT_MODE: offline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: release
      - name: Install JavaScript dependencies
        run: |
          corepack enable
          for dir in Grid Report Learn; do (cd "$dir" && pnpm install --frozen-lockfile); done
      - name: Build the test application
        run: DOTNET="$(command -v dotnet)" ./build.sh
      - name: Repeated native R console checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          for attempt in 1 2; do
            R_BIN="$(command -v R)" R_SCRIPT="$(command -v Rscript)" bash Scripts/test-r-console-integration.sh "$PWD/StatsDirect.app" 2>&1 | tee ".build/r-console-layout-probe-${attempt}.log"
            grep -Fq 'PASS: live WebKit interactive R console integration completed' ".build/r-console-layout-probe-${attempt}.log"
          done
      - name: Retain native test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: r-console-layout-probe
          path: .build/r-console-layout-probe-*.log
          if-no-files-found: warn
          retention-days: 7
