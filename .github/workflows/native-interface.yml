name: Native interface checks

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional release or draft providing the runtime; leave blank to build current source
        required: false
      suite:
        description: Native interface to check using the current source
        required: true
        type: choice
        options: [calculator, help, grid, parity, report, toolbars, startup, follow-ons, integration, content]

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    # GitHub exposes draft releases only to tokens with repository push access.
    # This manually dispatched job reads the draft; it never publishes a release.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SUITE: ${{ inputs.suite }}
      STATSDIRECT_CONTENT_MODE: offline
    steps:
      - name: Validate content suite inputs
        if: inputs.suite == 'content' && inputs.release_tag != ''
        run: |
          echo '::error::The content suite checks current source. Leave release_tag blank.'
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: inputs.suite == 'integration' || inputs.release_tag == ''
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.suite == 'integration' || inputs.release_tag == ''
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: inputs.suite == 'integration' || inputs.release_tag == ''
        with:
          python-version: '3.12'
      - name: Install build and integration test dependencies
        if: inputs.suite == 'integration' || inputs.release_tag == ''
        run: |
          corepack enable
          for dir in Grid Report Learn; do (cd "$dir" && pnpm install --frozen-lockfile); done
          python3 -m pip install openpyxl nbformat==5.10.4
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: inputs.suite == 'report' || inputs.suite == 'startup' || inputs.suite == 'integration' || inputs.release_tag == ''
        with:
          r-version: release
      - name: Get the packaged runtime
        if: inputs.release_tag != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          package="StatsDirect-${RELEASE_TAG#v}-macOS-arm64.zip"
          gh release download "$RELEASE_TAG" --pattern "$package"
          checksum="StatsDirect-${RELEASE_TAG#v}-SHA256SUMS.txt"
          if ! gh release download "$RELEASE_TAG" --pattern "$checksum"; then
            checksum=SHA256SUMS.txt
            gh release download "$RELEASE_TAG" --pattern "$checksum"
          fi
          shasum -a 256 -c <(grep -F "  $package" "$checksum")
          ditto -x -k "$package" .
      - name: Build the current application
        if: inputs.release_tag == ''
        run: DOTNET="$(command -v dotnet)" ./build.sh
      - name: Check the native interface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .build
          case "$SUITE" in
            calculator) Scripts/test-calculator-pane.sh ;;
            help) Scripts/test-help-pane.sh ;;
            grid) Scripts/test-grid-selection.sh ;;
            parity) bash Scripts/test-mac-parity.sh ;;
            report) Scripts/test-report-export.sh ;;
            toolbars) Scripts/test-unified-toolbar.sh ;;
            startup) bash Scripts/test-startup-r-setup.sh ;;
            follow-ons) bash Scripts/test-follow-on-workflow.sh ;;
            content)
              python3 Tests/test_desktop_help_import.py
              python3 Tests/test_authored_tutor_import.py
              python3 Tests/test_content_publication.py
              python3 Tests/test_content_build.py
              python3 Scripts/check-content-imports.py
              python3 Tests/test_packaged_content.py "$PWD/StatsDirect.app"
              python3 Tests/test_desktop_help.py
              STATSDIRECT_CONTENT_ROOT="$PWD/Content" STATSDIRECT_LEARN_ARCHIVE="$PWD/Docs/Learn/bank.mjs" node --import ./Learn/test-register.mjs --test Learn/Upstream/Learning/*.test.mjs Learn/*.test.mjs
              node Learn/build.mjs
              git diff --exit-code -- Content/Learn Content/AI
              swiftc -target arm64-apple-macosx14.0 -module-cache-path .build/swift-cache Sources/LearningLibrary.swift Tests/learning-library-test.swift -o .build/learning-library-test
              .build/learning-library-test Content/Learn/lessons.json
              Scripts/test-help-pane.sh "$PWD/StatsDirect.app"
              Scripts/test-provider-learning.sh "$PWD/StatsDirect.app"
              ;;
            integration)
              python3 Tests/run_beta_feedback.py
              python3 Tests/verify-report-documents.py .build/beta-feedback-exports
              ;;
            *) exit 2 ;;
          esac
      - name: Preserve parity failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-parity-diagnostics
          path: |
            .build/mac-parity.*/native.log
            .build/mac-parity.*/sample*.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
