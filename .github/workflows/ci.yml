name: Build and test

# Every push to main and every pull request builds the application on an Apple Silicon runner
# and runs the suites the handovers describe: the engine and R comparison tests, the JavaScript
# tests, the Excel and data-file tests, the report export and the WebKit integration driver.
# The committed grid, report and learning bundles are checked against their sources.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      STATSDIRECT_CONTENT_MODE: offline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Enable pnpm through corepack
        run: corepack enable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build/nuget
          key: ${{ runner.os }}-build-${{ hashFiles('FullEngine/*.csproj', 'FullEngine/Upstream/**/*.csproj') }}
      - name: Install JavaScript dependencies
        run: for dir in Grid Report Learn; do (cd "$dir" && pnpm install --frozen-lockfile); done
      - name: Install document test dependencies
        run: python3 -m pip install openpyxl xlrd nbformat==5.10.4
      - name: Published help and tutor imports
        run: |
          python3 Tests/test_desktop_help_import.py
          python3 Tests/test_authored_tutor_import.py
          python3 Tests/test_content_publication.py
          python3 Tests/test_content_build.py
          python3 Scripts/check-content-imports.py
      - name: Build the application
        run: DOTNET="$(command -v dotnet)" ./build.sh
      - name: Committed bundles match their sources
        run: |
          node Grid/build.mjs && node Report/build.mjs && node Learn/build.mjs
          git diff --exit-code --stat -- Content/Grid Content/Report Content/Learn Content/AI
          python3 Tests/test_packaged_content.py "$PWD/StatsDirect.app"
      - name: AppKit R quit lifecycle
        run: bash Scripts/test-r-console-termination.sh "$PWD/StatsDirect.app/Contents/MacOS/RConsoleWorker"
      - name: Update discovery
        run: |
          swiftc -g -target arm64-apple-macosx14.0 -module-cache-path .build/swift-cache Sources/UpdateService.swift Tests/update-service-test.swift -o .build/update-service-test
          .build/update-service-test --app "$PWD/StatsDirect.app"
      - name: Engine and R comparison tests
        run: ./test.sh
      - name: Worksheet column selection gestures
        run: Scripts/test-grid-selection.sh
      - name: Mac parity workflows
        run: bash Scripts/test-mac-parity.sh
      - name: Paired t-test workflow
        run: Scripts/test-paired-workflow.sh
      - name: Analysis follow-on workflows
        run: bash Scripts/test-follow-on-workflow.sh
      - name: Excel and data file tests
        run: |
          clang++ -std=c++17 -arch arm64 Tests/workbook-driver.cpp -o .build/workbook-driver
          swiftc Sources/RInstallation.swift Sources/RDataFileIO.swift Sources/CSVFileIO.swift Sources/Snapshot.swift Tests/data-file-driver.swift -o .build/data-file-driver
          python3 Tests/test_xls_export.py .build/workbook-driver
          python3 Tests/test_excel.py .build/workbook-driver "$(command -v node)"
          python3 Tests/test_excel_edges.py .build/workbook-driver "$(command -v node)"
          python3 Tests/test_excel_inserts.py .build/workbook-driver
          python3 Tests/test_excel_structures.py .build/workbook-driver
          python3 Tests/test_excel_compatibility.py .build/workbook-driver "$(command -v node)"
          python3 Tests/test_data_files.py .build/data-file-driver "$(command -v node)"
      - name: Offline HTML5 help
        run: |
          python3 Tests/test_desktop_help.py
          Scripts/test-help-pane.sh
      - name: Calculator
        run: |
          clang++ -std=c++17 -arch arm64 Tests/calculator-driver.cpp -o .build/calculator-driver
          python3 Tests/test_calculator.py
          Scripts/test-calculator-pane.sh
      - name: Analysis selection and forms
        run: Scripts/test-analysis-workflow.sh
      - name: Report export
        run: Scripts/test-report-export.sh
      - name: Office SVG clipboard fonts
        run: bash Scripts/test-office-svg.sh
      - name: Chart PNG export cancellation and cleanup
        run: bash Scripts/test-r-chart-export-lifetime.sh
      - name: Unified document toolbars
        run: Scripts/test-unified-toolbar.sh
      - name: Legacy R pane integration and output
        run: |
          Scripts/test-r-integration.sh
          Scripts/test-r-pane.sh
      - name: Native R architecture and first-use setup
        run: |
          R_SCRIPT="$(command -v Rscript)" bash Scripts/prepare-r-console-svg.sh
          python3 Tests/test_r_console_setup.py
          R_BIN="$(command -v R)" R_SCRIPT="$(command -v Rscript)" python3 Tests/test_worker_signing.py StatsDirect.app/Contents/MacOS/RConsoleWorker
          swiftc -target arm64-apple-macosx14.0 Sources/RInstallation.swift Tests/r-runtime-architecture-checks.swift -o .build/r-runtime-architecture-checks -framework CryptoKit
          .build/r-runtime-architecture-checks
      - name: Interactive R console and vector charts
        # The failing check and the runner's environment become annotations, which the public API shows without the job log.
        run: |
          echo "::notice title=Environment::image ${ImageOS:-unknown} ${ImageVersion:-unknown}; macOS $(sw_vers -productVersion); $(xcodebuild -version | tr '\n' ' '); $(R --version | head -1)"
          set -o pipefail
          if ! R_BIN="$(command -v R)" R_SCRIPT="$(command -v Rscript)" bash Scripts/test-r-console-integration.sh "$PWD/StatsDirect.app" 2>&1 | tee .build/r-console-integration.log; then
            grep -c '^PASS' .build/r-console-integration.log | sed 's/^/::error title=R console integration::checks passed before the failure: /'
            grep -n -E '^(FAIL|INFO)' .build/r-console-integration.log | tail -n 6 | sed 's/^/::error title=R console integration::/'
            exit 1
          fi
      - name: Startup, recent documents and guided R setup
        run: bash Scripts/test-startup-r-setup.sh
      - name: Script and report AI docks and sharing
        run: |
          Scripts/test-ai-sharing.sh
          Scripts/test-script-ai.sh
          Scripts/test-report-ai.sh
      - name: Conversation R replay and Learning recovery
        run: |
          RSCRIPT="$(command -v Rscript)" bash Scripts/test-conversation-r.sh
          bash Scripts/test-learning-recovery.sh
      - name: First-use AI installation and protocol
        run: |
          Scripts/test-tutor-runtime.sh
          Scripts/test-tutor-protocol.sh
          Scripts/test-tutor-setup.sh
      - name: WebKit integration driver
        run: |
          set -o pipefail
          for attempt in 1 2; do
            log=".build/webkit-attempt-$attempt.log"
            if python3 Tests/run_beta_feedback.py 2>&1 | tee "$log"; then
              exit 0
            else
              result=$?
            fi
            # Retry only the observed hosted-WebKit wait timeout, never assertions,
            # compilation errors or statistical failures. Preserve both logs.
            if [[ "$attempt" == 2 ]] || ! grep -Fq 'FAIL: Failure(message: "Timed out waiting for the native interface at ' "$log"; then
              # The failing check becomes an annotation, which the public API shows without the job log.
              grep -c '^PASS' "$log" | sed 's/^/::error title=WebKit integration driver::checks passed before the failure: /'
              grep -n -E '^(FAIL|Traceback|.*Error:|error:)' "$log" | tail -n 6 | cut -c1-900 | sed 's/^/::error title=WebKit integration driver::/'
              exit "$result"
            fi
            echo '::warning::WebKit wait timed out; retrying once with a fresh test app.'
          done
      - name: Preserve parity failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-parity-diagnostics
          path: |
            .build/mac-parity.*/native.log
            .build/mac-parity.*/sample*.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
